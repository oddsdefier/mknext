version: 2
updates:
  # Every action is pinned to a commit SHA. Dependabot keeps those current.
  # npm packages stay out: versions.env pins them, and minimumReleaseAge governs them.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: ci
