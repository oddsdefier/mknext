name: Clean pull request body

on:
  pull_request_target:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v8
        with:
          script: |
            const body = context.payload.pull_request.body ?? '';
            const aiAttributionRegex = /((co-authored-by|signed-off-by):.*(claude|anthropic|chatgpt|codex|cursor|gemini)|(generated|written|created)\s+(by|with)\s+.*(claude|anthropic|chatgpt|codex|cursor|gemini)|claude(-|\s+)(code|session)|https?:\/\/claude\.ai\/code)/i;
            const cleanBody = body
              .split('\n')
              .filter((line) => !aiAttributionRegex.test(line))
              .join('\n');
            if (cleanBody !== body) {
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                body: cleanBody,
              });
            }
