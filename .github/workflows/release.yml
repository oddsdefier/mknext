name: Release

on:
  push:
    branches: [main]
    paths: [VERSION]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag:
    name: tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag the release
        run: |
          set -o errexit
          set -o nounset
          set -o pipefail
          version=$(tr -d '[:space:]' < VERSION)
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *)
              printf 'error: VERSION holds "%s", not a version number\n' "$version" >&2
              exit 1
              ;;
          esac
          tag="v$version"
          # The tag is what install.sh and mknext update clone. Never move one.
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            printf '%s already exists. Nothing to release.\n' "$tag"
            exit 0
          fi
          git tag "$tag"
          git push origin "$tag"
          printf 'Released %s\n' "$tag"
